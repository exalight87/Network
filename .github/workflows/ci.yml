name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libgtest-dev cmake ninja-build

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Configure debug
        run: xmake f -m debug -y

      - name: Build debug
        run: xmake build -y

      - name: Run tests
        run: xmake test

      - name: Configure release
        run: xmake f -m release -y

      - name: Build release
        run: xmake build -y

      - name: Configure native performance benchmark
        run: xmake f -m release --with_gtest=y --with_curl=y -y

      - name: Build native performance benchmark
        run: xmake build -y performance_tests

      - name: Benchmark C++ server
        run: |
          set -o pipefail
          ./build/linux/x86_64/release/performance_tests | tee performance.log

      - name: Generate benchmark report
        run: node scripts/performance-report.mjs performance.log website/data/benchmarks.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: showcase-benchmark-${{ github.sha }}
          path: website/data/benchmarks.json

      - name: Publish benchmark results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/data/benchmarks.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(benchmark): update CI results [skip ci]"
          git push
